<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-sd-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22e1ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow-sd-2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="480" height="220" rx="14" fill="#0a0e18"/>

  <!-- calendar -->
  <g stroke="#7f8caf" stroke-width="2.5" fill="none" stroke-linejoin="round">
    <rect x="140" y="66" width="100" height="92" rx="8"/>
    <line x1="140" y1="92" x2="240" y2="92"/>
    <line x1="164" y1="56" x2="164" y2="76"/>
    <line x1="216" y1="56" x2="216" y2="76"/>
  </g>
  <g fill="#3a4560" opacity="0.7">
    <circle cx="160" cy="108" r="3"/>
    <circle cx="180" cy="108" r="3"/>
    <circle cx="200" cy="108" r="3"/>
    <circle cx="220" cy="108" r="3"/>
    <circle cx="160" cy="126" r="3"/>
    <circle cx="180" cy="126" r="3"/>
    <circle cx="220" cy="126" r="3"/>
    <circle cx="160" cy="144" r="3"/>
    <circle cx="180" cy="144" r="3"/>
    <circle cx="200" cy="144" r="3"/>
  </g>
  <!-- highlighted patch date -->
  <circle cx="200" cy="126" r="9" fill="none" stroke="url(#grad-sd-2)" stroke-width="2.5" filter="url(#glow-sd-2)"/>

  <!-- clock overlapping, indicating scheduled night time -->
  <circle cx="270" cy="145" r="34" fill="#0a0e18" stroke="#f6f8fc" stroke-width="2.4"/>
  <line x1="270" y1="145" x2="270" y2="124" stroke="#f6f8fc" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="270" y1="145" x2="286" y2="153" stroke="url(#grad-sd-2)" stroke-width="2.8" stroke-linecap="round" filter="url(#glow-sd-2)"/>
  <circle cx="270" cy="145" r="2.4" fill="#f6f8fc"/>

  <!-- moon sliver: night / off-hours -->
  <path d="M 300 100 A 12 12 0 1 0 300 122 A 9 9 0 1 1 300 100 Z" fill="#7f8caf" opacity="0.6"/>
</svg>
