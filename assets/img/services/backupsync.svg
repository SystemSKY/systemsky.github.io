  <path d="M 178 130 V 142 H 190" fill="none" stroke="#7f8caf" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="148" y1="155" x2="180" y2="155" stroke="#7f8caf" stroke-width="1.8"/>
  <line x1="148" y1="165" x2="180" y2="165" stroke="#7f8caf" stroke-width="1.8"/>

  <!-- Bewegungsspur (Transfer-Trail) -->
  <g stroke="url(#grad-t2)" fill="none" stroke-linecap="round" filter="url(#glow-t2)">
    <path d="M 190 150 Q 230 110 262 92" stroke-width="3.4" opacity="0.9"/>
    <path d="M 196 162 Q 232 128 258 108" stroke-width="2.4" opacity="0.5"/>
    <path d="M 202 174 Q 236 146 254 124" stroke-width="1.6" opacity="0.3"/>
  </g>

  <!-- Cloud (Ziel) mit Glow -->
  <path d="M 300 110
