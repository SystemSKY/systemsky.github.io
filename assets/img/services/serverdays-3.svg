<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-vpn-so3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22e1ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow-vpn-so3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="480" height="220" rx="14" fill="#0a0e18"/>

  <!-- server, left -->
  <g stroke="#7f8caf" stroke-width="2.2" fill="none" stroke-linejoin="round">
    <rect x="34" y="96" width="52" height="20" rx="4"/>
    <rect x="34" y="122" width="52" height="20" rx="4"/>
    <rect x="34" y="148" width="52" height="20" rx="4"/>
  </g>
  <g fill="#7f8caf">
    <circle cx="45" cy="106" r="2"/>
    <circle cx="45" cy="132" r="2"/>
    <circle cx="45" cy="158" r="2"/>
  </g>

  <!-- tunnel casing (subtle outer lines) -->
  <path d="M 90 118 C 160 118, 300 118, 370 118" fill="none" stroke="#7f8caf" stroke-width="1.2" opacity="0.35"/>
  <path d="M 90 138 C 160 138, 300 138, 370 138" fill="none" stroke="#7f8caf" stroke-width="1.2" opacity="0.35"/>

  <!-- dashed encrypted core -->
  <path d="M 90 128 C 160 128, 300 128, 370 128" fill="none" stroke="url(#grad-vpn-so3)"
        stroke-width="3" stroke-linecap="round" stroke-dasharray="1 12" filter="url(#glow-vpn-so3)"/>

  <!-- lock at the midpoint, sitting directly on the tunnel -->
  <circle cx="230" cy="128" r="22" fill="#0a0e18" stroke="url(#grad-vpn-so3)" stroke-width="2.6" filter="url(#glow-vpn-so3)"/>
  <path d="M 221 123 V 118 A 9 9 0 0 1 239 118 V 123" fill="none" stroke="#f6f8fc" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="217" y="123" width="26" height="19" rx="3" fill="#0a0e18" stroke="#f6f8fc" stroke-width="2.2"/>

  <!-- office building, right, wider footprint -->
  <rect x="378" y="52" width="78" height="126" rx="4" fill="none" stroke="url(#grad-vpn-so3)" stroke-width="2.6" filter="url(#glow-vpn-so3)"/>
  <g stroke="#7f8caf" stroke-width="1.3" opacity="0.65">
    <line x1="393" y1="52" x2="393" y2="178"/>
    <line x1="408" y1="52" x2="408" y2="178"/>
    <line x1="423" y1="52" x2="423" y2="178"/>
    <line x1="438" y1="52" x2="438" y2="178"/>
    <line x1="378" y1="68" x2="456" y2="68"/>
    <line x1="378" y1="84" x2="456" y2="84"/>
    <line x1="378" y1="100" x2="456" y2="100"/>
    <line x1="378" y1="116" x2="456" y2="116"/>
    <line x1="378" y1="132" x2="456" y2="132"/>
    <line x1="378" y1="148" x2="456" y2="148"/>
  </g>
  <rect x="404" y="152" width="26" height="26" fill="#0a0e18" stroke="#f6f8fc" stroke-width="2"/>
</svg>
