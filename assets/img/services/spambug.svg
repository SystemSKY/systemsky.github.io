<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-v2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22e1ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow-v2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="mail-v2" viewBox="0 0 18 13">
      <rect x="0" y="0" width="18" height="13" rx="2" fill="#0a0e18" stroke="url(#grad-v2)" stroke-width="1.6"/>
      <path d="M 0 1.5 L 9 8 L 18 1.5" fill="none" stroke="url(#grad-v2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
  <rect x="0" y="0" width="480" height="220" rx="14" fill="#0a0e18"/>

  <!-- Speichen zum Hub -->
  <g stroke="#7f8caf" stroke-width="1.6" opacity="0.45">
    <line x1="240" y1="110" x2="420" y2="110"/>
    <line x1="240" y1="110" x2="330" y2="178"/>
    <line x1="240" y1="110" x2="150" y2="178"/>
    <line x1="240" y1="110" x2="60" y2="110"/>
    <line x1="240" y1="110" x2="150" y2="42"/>
    <line x1="240" y1="110" x2="330" y2="42"/>
  </g>

  <!-- Aeussere Server -->
  <g fill="#0a0e18" stroke="#7f8caf" stroke-width="2">
    <rect x="398" y="92" width="44" height="36" rx="6"/>
    <rect x="308" y="160" width="44" height="36" rx="6"/>
    <rect x="128" y="160" width="44" height="36" rx="6"/>
    <rect x="38" y="92" width="44" height="36" rx="6"/>
    <rect x="128" y="24" width="44" height="36" rx="6"/>
    <rect x="308" y="24" width="44" height="36" rx="6"/>
  </g>
  <g fill="#7f8caf">
    <circle cx="408" cy="118" r="2.2"/>
    <circle cx="318" cy="186" r="2.2"/>
    <circle cx="138" cy="186" r="2.2"/>
    <circle cx="48" cy="118" r="2.2"/>
    <circle cx="138" cy="50" r="2.2"/>
    <circle cx="318" cy="50" r="2.2"/>
  </g>

  <!-- zentraler Hub mit Glow -->
  <circle cx="240" cy="110" r="26" fill="#0a0e18" stroke="url(#grad-v2)" stroke-width="3.2" filter="url(#glow-v2)"/>
  <circle cx="240" cy="110" r="6" fill="url(#grad-v2)" filter="url(#glow-v2)"/>

  <!-- Mail-Verkehr auf den Speichen -->
  <g filter="url(#glow-v2)">
    <use href="#mail-v2" x="300" y="104" width="18" height="13"/>
    <use href="#mail-v2" x="356" y="104" width="18" height="13"/>
    <use href="#mail-v2" x="272" y="132" width="18" height="13"/>
    <use href="#mail-v2" x="300" y="153" width="18" height="13"/>
    <use href="#mail-v2" x="180" y="132" width="18" height="13"/>
    <use href="#mail-v2" x="152" y="153" width="18" height="13"/>
    <use href="#mail-v2" x="130" y="104" width="18" height="13"/>
    <use href="#mail-v2" x="74" y="104" width="18" height="13"/>
    <use href="#mail-v2" x="180" y="86" width="18" height="13"/>
    <use href="#mail-v2" x="152" y="65" width="18" height="13"/>
    <use href="#mail-v2" x="272" y="86" width="18" height="13"/>
    <use href="#mail-v2" x="300" y="65" width="18" height="13"/>
  </g>
</svg>
