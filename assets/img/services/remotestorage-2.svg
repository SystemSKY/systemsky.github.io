<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-websma-cloud4b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22e1ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow-websma-cloud4b" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="480" height="220" rx="14" fill="#0a0e18"/>

  <!-- Cloud-Outline mit Glow -->
  <path d="M 155 175
           Q 118 175 118 143
           Q 118 116 146 111
           Q 150 82 182 79
           Q 202 55 232 71
           Q 258 55 282 76
           Q 312 81 317 111
           Q 345 116 345 143
           Q 345 175 308 175
           Z"
        fill="#0a0e18" stroke="url(#grad-websma-cloud4b)" stroke-width="3"
        stroke-linejoin="round" filter="url(#glow-websma-cloud4b)"/>

  <!-- Ordnersymbol mittig zwischen den Pfeilen -->
  <path d="M 206 116 L 206 111 L 225 111 L 229 116 L 258 116 L 258 144 L 206 144 Z"
        fill="#0a0e18" stroke="#f6f8fc" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Upload-Pfeil (oben) -->
  <g stroke="url(#grad-websma-cloud4b)" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-websma-cloud4b)">
    <path d="M 232 106 V 80"/>
    <path d="M 218 95 L 232 80 L 246 95"/>
  </g>

  <!-- Download-Pfeil (unten) -->
  <g stroke="url(#grad-websma-cloud4b)" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-websma-cloud4b)">
    <path d="M 232 149 V 175"/>
    <path d="M 218 160 L 232 175 L 246 160"/>
  </g>
</svg>
